[project]
name = "flathunter"
version = "0.1.0"
description = "FlatHunter V0 - Telegram-first rental search concierge for Hyderabad"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "aiogram>=3.7.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "supabase>=2.5.1",
    "google-generativeai>=0.7.1",
    "httpx>=0.27.0",
    "aiosmtplib>=3.0.1",
    "aioimaplib>=1.0.1",
    "python-dateutil>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
